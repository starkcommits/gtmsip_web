<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta property="og:url" content="https://gtmsip.com/" />
  <meta property="og:title" content="GTMSip — AI Sales &amp; Marketing Automation Platform" />
  <meta property="og:description"
    content="Automate sales, marketing, lead generation and customer engagement with GTMSip. AI workflows, Firecrawl lead scraping, Claude MCP, and a shared WhatsApp &amp; Instagram inbox." />

  <meta property="og:image:alt" content="GTMSip — AI Sales &amp; Marketing Automation Platform" />

  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:image:alt" content="GTMSip — AI Sales &amp; Marketing Automation Platform" />

  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0a14" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    rel="stylesheet" />

  <!-- Brand Structured Data -->
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://gtmsip.com/#organization",
            "name": "GTMSip",
            "url": "https://gtmsip.com",
            "logo": "https://gtmsip.com/images/logo-256.png",
            "description": "AI-driven sales and social automation platform connecting Firecrawl lead scraping, Claude MCP workflows, and shared WhatsApp & Instagram inboxes."
          },
          {
            "@type": "WebSite",
            "@id": "https://gtmsip.com/#website",
            "url": "https://gtmsip.com",
            "name": "GTMSip",
            "description": "AI sales & marketing automation platform for lead scraping, WhatsApp CRM, and Instagram social selling.",
            "publisher": {
              "@id": "https://gtmsip.com/#organization"
            }
          }
        ]
      }
    </script>

  <script>
    (function () {
      try {
        var t = localStorage.getItem("gtmsip-theme");
        var dark =
          t === "dark" ||
          (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
